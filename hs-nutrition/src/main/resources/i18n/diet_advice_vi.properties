# Câu giải thích màu đánh giá, tiếng Việt. Khóa phải trùng diet_advice.properties.
# MessageFormat: {0}, {1} là chuỗi đã định dạng sẵn; dấu nháy đơn viết là ''.

# ---- Thành phần
amount={0} {1}/100 g
unit.SODIUM=mg natri
limitAmount={0} (đỏ khi trên {1})
cautionAmount={0} (vàng khi trên {1})
advised.prescribed=Bác sĩ dặn bạn {0}
advised.general=Nên {0}

# ---- Thiếu số liệu
noun.SODIUM=muối (natri)
noun.ALCOHOL=cồn
noun.CAFFEINE=caffeine
noun.VITAMIN_K=vitamin K
unknown=Chưa có số liệu {0} của món này.

# ---- Đỏ (LIMIT)
limit.ALCOHOL=Có cồn: {0}. {1}; cồn là yếu tố kích phát cơn rung nhĩ rõ nhất.
limit.ALCOHOL.advice=tránh rượu bia
limit.CAFFEINE=Rất nhiều caffeine: {0}. {1}.
limit.CAFFEINE.advice=hạn chế caffeine
limit.SUGARS=Nhiều đường: {0}. {1}.
limit.SUGARS.advice=hạn chế đồ ngọt
limit.SODIUM=Nhiều muối: {0}. {1}.
limit.SODIUM.advice=hạn chế muối
limit.SATURATED_FAT=Nhiều chất béo bão hòa: {0}. {1}.
limit.SATURATED_FAT.advice=hạn chế chất béo bão hòa
limit.VITAMIN_K=Rất nhiều vitamin K: {0}. Bạn đang dùng warfarin: hỏi bác sĩ trước khi ăn món này thường xuyên.

# ---- Vàng (CAUTION)
caution.ALCOHOL=Có cồn: {0}. Chú ý lượng uống.
caution.CAFFEINE=Nhiều caffeine: {0}. {1}; liều cao làm tim đập nhanh.
caution.CAFFEINE.advice=dùng caffeine vừa phải
caution.SUGARS=Đường ở mức vừa: {0}. Chú ý lượng ăn.
caution.SODIUM=Muối ở mức vừa: {0}. Chú ý lượng ăn.
caution.SATURATED_FAT=Chất béo bão hòa ở mức vừa: {0}. Chú ý lượng ăn.
caution.VITAMIN_K=Nhiều vitamin K: {0}. Bạn đang dùng warfarin: không cần kiêng, nhưng nên ăn lượng đều mỗi ngày, không tự ý ăn nhiều hơn hoặc bỏ hẳn.

# ---- Tỷ lệ natri/kali
naK.limit=Natri cao hơn nhiều so với kali (Na/K {0}, đỏ khi trên {1}{2}): dễ gây giữ nước, tăng áp lực lên tim và khởi phát rung nhĩ.
naK.limit.salty=\ và natri trên {0} mg
naK.limit.prescribed=Bác sĩ dặn bạn theo dõi tỷ lệ natri/kali.
naK.good=Kali bằng hoặc nhiều hơn natri (Na/K {0}): giúp ổn định nhịp tim.

# ---- Magie
magnesium.good=Giàu magie ({0} mg/100 g) và ít muối: hỗ trợ ổn định điện thế cơ tim.
magnesium.good.prescribed=Bác sĩ khuyến khích bạn ăn món giàu magie.
