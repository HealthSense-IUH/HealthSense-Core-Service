services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: healthsense-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  mongodb:
    image: mongo:7.0
    container_name: healthsense-mongodb
    environment:
      MONGO_INITDB_DATABASE: healthsense_chat
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
