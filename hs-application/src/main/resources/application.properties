spring.application.name=hs-application

# security configuration
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
security.jwt.issuer=${JWT_ISSUER:healthsense-auth}
security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:classpath:keys/private.pem}
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}
security.jwt.key-id=${JWT_KEY_ID:healthsense-auth-dev-key}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
security.jwt.mobile-access-token-ttl=${JWT_MOBILE_ACCESS_TOKEN_TTL:9999d}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
security.cookie.secure=${COOKIE_SECURE:false}
security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
security.cookie.path=${COOKIE_PATH:/api/auth}

# database configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthsense}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# mail / SMTP configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_SENDER:local@example.com}
spring.mail.password=${MAIL_SENDER_PASSWORD:local-mail-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# notification configuration
app.notification.mail.from=${MAIL_SENDER:local@example.com}
app.notification.otp.ttl=5m
app.notification.reset-token.ttl=5m

# rate limiter configuration
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:5}

# snowflake id configuration
snowflake.worker-id=${SNOWFLAKE_WORKER_ID:1}
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}

# bootstrap super admin
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:System Super Admin}

# aws s3 configuration (Vui lòng thay thế bằng Key AWS thực tế của bạn tại đây hoặc qua biến môi trường)
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.endpoint-url=${AWS_S3_ENDPOINT_URL:}
aws.s3.presigned-url-ttl-minutes=${AWS_S3_PRESIGNED_TTL_MINUTES:15}

# rabbitmq configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# health record event configuration
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:health.record.exchange}
app.rabbitmq.queue.processing=${RABBITMQ_QUEUE_PROCESSING:health.record.processing.queue}
app.rabbitmq.routing-key.processing=${RABBITMQ_ROUTING_KEY_PROCESSING:health.record.process.routing}