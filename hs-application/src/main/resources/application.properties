spring.application.name=hs-application

# security configuration
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
security.jwt.issuer=${JWT_ISSUER:healthsense-auth}
security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:classpath:keys/private.pem}
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}
security.jwt.key-id=${JWT_KEY_ID:healthsense-auth-key}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
security.jwt.mobile-access-token-ttl=${JWT_MOBILE_ACCESS_TOKEN_TTL:15m}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
security.cookie.secure=${COOKIE_SECURE:false}
security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
security.cookie.path=${COOKIE_PATH:/api/auth}

# database configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthsense}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# mongodb configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/healthsense_chat}
spring.data.mongodb.database=${MONGODB_DATABASE:healthsense_chat}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/healthsense_chat}
spring.mongodb.database=${MONGODB_DATABASE:healthsense_chat}

# redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# mail / SMTP configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_SENDER:}
spring.mail.password=${MAIL_SENDER_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# notification configuration
app.notification.mail.from=${MAIL_SENDER:}
app.notification.otp.ttl=5m
app.notification.reset-token.ttl=5m

# rate limiter configuration
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:1000}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:500}

# consultation configuration
app.consultation.default-doctor-max-active-sessions=${CONSULTATION_DEFAULT_DOCTOR_MAX_ACTIVE_SESSIONS:3}
app.payment.return-url=${PAYMENT_RETURN_URL:http://localhost:3000}
app.payment.cancel-url=${PAYMENT_CANCEL_URL:http://localhost:3000}
app.payment.payos.client-id=${PAYOS_CLIENT_ID:dummy}
app.payment.payos.api-key=${PAYOS_API_KEY:dummy}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:dummy}
app.payment.expiration-fixed-delay-ms=${PAYMENT_EXPIRATION_FIXED_DELAY_MS:60000}

# websocket / stomp configuration
app.websocket.endpoint=${WEBSOCKET_ENDPOINT:/ws/consultations}
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
app.websocket.application-destination-prefix=${WEBSOCKET_APPLICATION_DESTINATION_PREFIX:/app}
app.websocket.topic-prefix=${WEBSOCKET_TOPIC_PREFIX:/topic}
app.websocket.queue-prefix=${WEBSOCKET_QUEUE_PREFIX:/queue}
app.websocket.bearer-prefix=${WEBSOCKET_BEARER_PREFIX:Bearer }
app.websocket.access-token-type=${WEBSOCKET_ACCESS_TOKEN_TYPE:access}

# snowflake id configuration
snowflake.worker-id=${SNOWFLAKE_WORKER_ID:1}
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}

# bootstrap super admin
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@gmail.com}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:Test123@}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:Super Admin}

# aws s3 configuration (Vui lòng thay thế bằng Key AWS thực tế của bạn tại đây hoặc qua biến môi trường)
aws.s3.bucket=${AWS_S3_BUCKET:healthsense-bucket}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:dummy}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:dummy}
aws.s3.endpoint-url=${AWS_S3_ENDPOINT_URL:http://localhost:9000}
aws.s3.presigned-url-ttl-minutes=${AWS_S3_PRESIGNED_TTL_MINUTES:15}

# rabbitmq configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# health record event configuration
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:health.record.exchange}
app.rabbitmq.queue.processing=${RABBITMQ_QUEUE_PROCESSING:health.record.processing.queue}
app.rabbitmq.routing-key.processing=${RABBITMQ_ROUTING_KEY_PROCESSING:health.record.process.routing}

#default password for dev environment
app.dev.default-login-password=${DEV_DEFAULT_PASSWORD:Test123@}
app.dev.default-login-password-enabled=${DEV_DEFAULT_LOGIN_PASSWORD_ENABLED:true}
