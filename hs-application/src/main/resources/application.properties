spring.application.name=hs-application

# =========================================================
# SECURITY CONFIGURATION
# =========================================================
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

security.jwt.issuer=${JWT_ISSUER}
security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
security.jwt.key-id=${JWT_KEY_ID}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL}
security.jwt.mobile-access-token-ttl=${JWT_MOBILE_ACCESS_TOKEN_TTL}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL}

security.cookie.secure=${COOKIE_SECURE}
security.cookie.same-site=${COOKIE_SAME_SITE}
security.cookie.path=${COOKIE_PATH}


# =========================================================
# DATABASE / POSTGRESQL CONFIGURATION
# =========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# MONGODB CONFIGURATION
# =========================================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE}


# =========================================================
# REDIS CONFIGURATION
# =========================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}


# =========================================================
# MAIL / SMTP CONFIGURATION
# =========================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_SENDER}
spring.mail.password=${MAIL_SENDER_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# NOTIFICATION CONFIGURATION
# =========================================================
app.notification.mail.from=${MAIL_SENDER:}
app.notification.otp.ttl=5m
app.notification.reset-token.ttl=5m


# =========================================================
# RATE LIMITER CONFIGURATION
# =========================================================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS}


# =========================================================
# CONSULTATION CONFIGURATION
# =========================================================
app.consultation.default-doctor-max-active-sessions=${CONSULTATION_DEFAULT_DOCTOR_MAX_ACTIVE_SESSIONS}


# =========================================================
# PAYMENT / PAYOS CONFIGURATION
# =========================================================
app.payment.return-url=${PAYMENT_RETURN_URL}
app.payment.cancel-url=${PAYMENT_CANCEL_URL}

app.payment.payos.client-id=${PAYOS_CLIENT_ID}
app.payment.payos.api-key=${PAYOS_API_KEY}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY}

app.payment.expiration-fixed-delay-ms=${PAYMENT_EXPIRATION_FIXED_DELAY_MS}


# =========================================================
# WEBSOCKET / STOMP CONFIGURATION
# =========================================================
app.websocket.endpoint=${WEBSOCKET_ENDPOINT}
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}
app.websocket.application-destination-prefix=${WEBSOCKET_APPLICATION_DESTINATION_PREFIX}
app.websocket.topic-prefix=${WEBSOCKET_TOPIC_PREFIX}
app.websocket.queue-prefix=${WEBSOCKET_QUEUE_PREFIX}
app.websocket.bearer-prefix=${WEBSOCKET_BEARER_PREFIX}
app.websocket.access-token-type=${WEBSOCKET_ACCESS_TOKEN_TYPE}


# =========================================================
# SNOWFLAKE ID CONFIGURATION
# =========================================================
snowflake.worker-id=${SNOWFLAKE_WORKER_ID}
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID}


# =========================================================
# BOOTSTRAP SUPER ADMIN
# =========================================================
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_FULL_NAME}


# =========================================================
# AWS S3 CONFIGURATION
# =========================================================
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.endpoint-url=${AWS_S3_ENDPOINT_URL}
aws.s3.presigned-url-ttl-minutes=${AWS_S3_PRESIGNED_TTL_MINUTES}


# =========================================================
# RABBITMQ CONFIGURATION
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}


# =========================================================
# HEALTH RECORD EVENT / RABBITMQ CONFIGURATION
# =========================================================
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE}
app.rabbitmq.queue.processing=${RABBITMQ_QUEUE_PROCESSING}
app.rabbitmq.routing-key.processing=${RABBITMQ_ROUTING_KEY_PROCESSING}


# =========================================================
# DEFAULT PASSWORD FOR DEV ENVIRONMENT
# =========================================================
app.dev.default-login-password=${DEV_DEFAULT_PASSWORD}
app.dev.default-login-password-enabled=${DEV_DEFAULT_LOGIN_PASSWORD_ENABLED}
